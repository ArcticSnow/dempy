[workspace]
authors = ["Hugo Merzisen <hugo.merzisen@meteo.fr>"]
channels = ["conda-forge"]
name = "dempy"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "*"

[feature.topocalc.dependencies]
python = "3.9.*"
numpy = ">=1.15,<2"
click = ">=7.0"
setuptools_scm = "<4.2"
pip = ">=25.2,<26"
pooch = ">=1.8.2,<2"
matplotlib = ">=3.9.4,<4"
xarray = ">=2024.7.0,<2025"
rioxarray = ">=0.15.0,<0.16"
marimo = ">=0.14.17,<0.15"

[feature.topocalc.pypi-dependencies]
spatialnc = ">=0.2.12"

[feature.topocalc.tasks]
install-target = "python -m pip install --no-deps 'git+https://github.com/USDA-ARS-NWRC/topocalc/'"

[environments]
topocalc = ["topocalc"]
