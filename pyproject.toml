[project]
authors = [{name = "Hugo Merzisen", email = "hugo.merzisen@meteo.fr"}]
name = "dempy"
requires-python = ">= 3.9"
version = "0.1.0"


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
matplotlib = ">=3.11.2,<4"
pandas = ">=3.1.0,<4"
numba = ">=0.68.0,<0.69"
numpy = ">=2.5.4,<3"
pooch = ">=1.9.0,<2"
xarray = ">=2026.9.0,<2027"
rioxarray = ">=0.24.0,<0.25"
dask = ">=2026.8.0,<2027"
pyfftw = ">=0.15.1,<0.16"
scipy = ">=1.18.1,<2"
zarr = ">=3.4.2,<4"
opencv = ">=5.0.0,<6"
marimo = ">=0.25.1,<0.26"
openai = ">=3.41.0,<4"
mcp = ">=2.3.0,<3"
pydantic = ">=2.14.2,<3"
skyfield = ">=1.54,<2"
netcdf4 = ">=1.7.4,<2"
embree = ">=4.4.1,<5"
tbb-devel = ">=2023.1.0,<2024"
cython = ">=3.3.0,<4"
setuptools = ">=84.2.1,<85"
geographiclib = ">=2.1,<3"
tqdm = ">=4.70.1,<5"
requests = ">=2.34.2,<3"
pillow = ">=13.0.0,<14"
pyproj = ">=3.8.0,<4"
shapely = ">=2.2.0,<3"
fiona = ">=1.10.1,<2"
scikit-image = ">=0.26.0,<0.27"
rasterio = ">=1.5.2,<2"
trimesh = ">=5.2.0,<6"
pip = ">=26.2.2,<27"

[tool.pixi.feature.topocalc.dependencies]
python = "3.9.*"
numpy = ">=1.15,<2"
click = ">=7.0"
setuptools_scm = "<4.2"
pip = ">=25.2,<26"
pooch = ">=1.8.2,<2"
matplotlib = ">=3.9.4,<4"
xarray = ">=2024.7.0,<2025"
rioxarray = ">=0.15.0,<0.16"

[tool.pixi.feature.topocalc.pypi-dependencies]
spatialnc = ">=0.2.12"

[tool.pixi.pypi-dependencies]
dempy = { path = ".", editable = true }

[tool.pixi.tasks]
install-horayzon = "python -m pip install --no-deps 'git+https://github.com/ChristianSteger/HORAYZON'"

[tool.pixi.feature.topocalc.tasks]
install-topocalc = "python -m pip install --no-deps 'git+https://github.com/USDA-ARS-NWRC/topocalc/'"

[tool.pixi.feature.dev.dependencies]
mkdocs = "*"
ipython = ">=9.18.0,<10"
sphinx_rtd_theme = ">=3.1.0,<4"
mkdocs-material = ">=9.7.7,<10"
pygments = ">=2.21.0,<3"
mkdocs-bibtex = ">=4.4.0,<5"


[tool.pixi.environments]
topocalc = {features = ["topocalc"], no-default-feature = true }
default = { features = ["dev"] }



[tool.marimo.runtime]
watcher_on_save = "autorun"

